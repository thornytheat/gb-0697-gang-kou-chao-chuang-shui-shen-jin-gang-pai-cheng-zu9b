<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}}</title><link href="/static/theme.css" rel="stylesheet"><link href="/static/layout.css" rel="stylesheet"><link href="/static/components.css" rel="stylesheet"></head><body><div class="app"><aside class="rail"><a href="/" class="portmark">TIDE<br><span>引航调度室</span></a><nav>{% for m in modules %}<a href="/module/{{loop.index}}?run_id={{run.id}}" class="{{'selected' if active==loop.index else ''}}"><span>{{'%02d'|format(loop.index)}}</span>{{m}}</a>{% endfor %}</nav><div class="signal">UTC / 航道 01<br>水深基准 8m</div></aside><div class="work"><header class="topbar"><span class="channel">NORTH CHANNEL</span><h1>{{modules[active-1]}}</h1><a href="/api/export/{{run.id}}" class="btn">导出证据</a></header><main class="content">{% block body %}{% endblock %}</main><footer class="statusbar"><span>批次 {{run.id}} · 修订 {{run.revision}}</span><span>规则 {{run.rule_version}} / UTC</span><a href="/docs">接口</a></footer></div></div><script src="/static/tide-plot.js" defer></script><script src="/static/operations.js" defer></script></body></html>
